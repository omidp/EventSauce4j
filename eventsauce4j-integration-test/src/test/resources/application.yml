spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: test
    password: test
    driverClassName: org.h2.Driver
  jpa:
    open-in-view: false
    show-sql: true
    generateDdl: true
    properties:
      hibernate:
        ddl-auto: update
        dialect: org.hibernate.dialect.H2Dialect

eventsauce4j:
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    exchange: test.exchange
    queue: test.queue
    routingKeys:
      - test.key
  outbox:
    delayInterval: 2 #seconds
    lockName: test-outbox-lock
    enabled: true
